name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an environment
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The release tag, or `git rev-parse HEAD`"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - deploy/compose.yml (docs/self-hosting.md)
        - Local development (docker/compose.dev.yml + bun run dev)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs hub worker --tail=100`. Remove hostnames, emails and tokens before pasting."
      render: text
